[project]
name = "sigma-signal-analysis"
version = "0.1.0"
description = "Automated RF Signal Analysis and Demodulation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sigma Team" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
ml = [
    "torch>=2.1",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-qt>=4.3",
    "ruff>=0.3",
    "mypy>=1.8",
    "hypothesis>=6.90",
]
all = [
    "sigma-signal-analysis[gui,ml,dev]",
]

[project.scripts]
sigma = "src.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
